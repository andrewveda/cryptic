<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Cryptic Clues</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Raleway', sans-serif;
  background: #0a0a0a;
  color: #f5f5f5;
  overflow-x: hidden;
}

/* Background */
.bg-pattern {
  position: fixed;
  inset: 0;
  opacity: 0.03;
  pointer-events: none;
  z-index: 0;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 35px, #d4af37 35px, #d4af37 36px),
    repeating-linear-gradient(-45deg, transparent, transparent 35px, #d4af37 35px, #d4af37 36px);
}

/* Layout */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* Header */
header {
  text-align: center;
  padding: 60px 20px 40px;
}

h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 700;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #d4af37, #f4e5b1, #d4af37);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  margin-top: 10px;
  color: #d4af37;
  letter-spacing: 4px;
  font-size: 0.9rem;
}

/* Controls */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin: 40px 0;
}

.filter-btn {
  padding: 14px 22px;
  border: 2px solid #d4af37;
  background: transparent;
  color: #d4af37;
  font-weight: 600;
  cursor: pointer;
}

.filter-btn.active {
  background: #d4af37;
  color: #0a0a0a;
}

/* Grid */
.clue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 28px;
}

/* Cards */
.clue-card {
  border: 2px solid #d4af37;
  padding: 26px;
  position: relative;
  background: rgba(212,175,55,0.06);
  transition: transform 0.3s ease;
}

.clue-card:hover {
  transform: translateY(-6px);
}

.clue-number {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #d4af37;
  color: #0a0a0a;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.clue-text {
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 18px;
  padding-right: 56px;
}

.clue-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tag {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid #d4af37;
  color: #d4af37;
}

.clue-footer {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(212,175,55,0.4);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.date {
  font-size: 13px;
  color: #d4af37;
}

.solve-btn {
  padding: 8px 18px;
  border: 1.8px solid #d4af37;
  background: transparent;
  color: #d4af37;
  font-weight: 600;
  letter-spacing: 1px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.25s ease;
}

.solve-btn:hover {
  background: #d4af37;
  color: #0a0a0a;
}

/* Mobile */
@media (max-width: 768px) {
  .clue-grid { grid-template-columns: 1fr; }
  .clue-footer {
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
  }
}
</style>
</head>

<body>

<div class="bg-pattern"></div>

<div class="container">
  <header>
    <h1>CRYPTIC CLUES</h1>
    <div class="subtitle">MASTERFUL PUZZLES • TIMELESS ELEGANCE</div>
  </header>

  <div class="controls">
    <button class="filter-btn active" data-filter="all">ALL</button>
    <button class="filter-btn" data-filter="anagram">ANAGRAM</button>
    <button class="filter-btn" data-filter="acrostic">ACROSTIC</button>
    <button class="filter-btn" data-filter="charade">CHARADE</button>
    <button class="filter-btn" data-filter="hidden">HIDDEN</button>
    <button class="filter-btn" data-filter="homophone">HOMOPHONE</button>
    <button class="filter-btn" data-filter="double">DOUBLE DEF</button>
  </div>

  <div id="clueGrid" class="clue-grid"></div>
</div>

<script>
let clues = [];
let currentFilter = "all";

/* === LOAD CLUES FROM JSON === */
async function loadClues() {
  try {
    const res = await fetch("data/clues.json");
    clues = await res.json();
    render();
  } catch (e) {
    console.error("Failed to load clues.json", e);
  }
}

/* === RENDER GRID === */
function render() {
  const grid = document.getElementById("clueGrid");

  const filtered = clues.filter(c => {
    if (currentFilter === "all") return true;
    return c.type
      .toLowerCase()
      .split(",")
      .map(t => t.trim())
      .includes(currentFilter);
  });

  grid.innerHTML = filtered.map(c => `
    <div class="clue-card">
      <div class="clue-number">${c.id}</div>
      <div class="clue-text">${c.clue}</div>

      <div class="clue-meta">
        <span class="tag">${c.type.toUpperCase()}</span>
        <span class="tag">${c.difficulty.toUpperCase()}</span>
      </div>

      <div class="clue-footer">
        <span class="date">${c.date}</span>
        <a class="solve-btn"
           href="puzzles/puzzle.html?id=${c.id}">
           SOLVE
        </a>
      </div>
    </div>
  `).join("");
}

/* === FILTER BUTTONS === */
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn")
      .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

loadClues();
</script>

</body>
</html>
