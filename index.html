<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<title>Cryptic Clues</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;600&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── THEME VARIABLES ── */
:root {
  --bg:          #0a0a0a;
  --bg-modal:    rgba(0,0,0,0.97);
  --surface:     rgba(212,175,55,0.04);
  --surface2:    rgba(212,175,55,0.07);
  --surface3:    rgba(212,175,55,0.1);
  --surface4:    rgba(212,175,55,0.15);
  --border:      rgba(212,175,55,0.22);
  --border2:     rgba(212,175,55,0.3);
  --border3:     rgba(212,175,55,0.35);
  --border4:     rgba(212,175,55,0.4);
  --gold:        #d4af37;
  --gold-light:  #f4e5b1;
  --gold-dim:    rgba(212,175,55,0.55);
  --gold-faint:  rgba(212,175,55,0.28);
  --text:        #f5f5f5;
  --text-dim:    rgba(245,245,245,0.4);
  --input-bg:    rgba(0,0,0,0.35);
  --pattern-op:  0.03;
  --card-shadow: rgba(212,175,55,0.1);
}

html.light {
  --bg:          #f5eedc;
  --bg-modal:    rgba(230,215,180,0.98);
  --surface:     rgba(138,101,0,0.05);
  --surface2:    rgba(138,101,0,0.08);
  --surface3:    rgba(138,101,0,0.12);
  --surface4:    rgba(138,101,0,0.15);
  --border:      rgba(138,101,0,0.2);
  --border2:     rgba(138,101,0,0.3);
  --border3:     rgba(138,101,0,0.4);
  --border4:     rgba(138,101,0,0.45);
  --gold:        #8a6500;
  --gold-light:  #b08000;
  --gold-dim:    rgba(138,101,0,0.6);
  --gold-faint:  rgba(138,101,0,0.25);
  --text:        #2a1f00;
  --text-dim:    rgba(42,31,0,0.45);
  --input-bg:    rgba(245,238,220,0.6);
  --pattern-op:  0.055;
  --card-shadow: rgba(138,101,0,0.1);
}

body {
  font-family: 'Raleway', sans-serif;
  background: var(--bg); color: var(--text);
  overflow-x: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

.bg-pattern {
  position: fixed; inset: 0; opacity: var(--pattern-op);
  pointer-events: none; z-index: 0;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 35px, var(--gold) 35px, var(--gold) 36px),
    repeating-linear-gradient(-45deg, transparent, transparent 35px, var(--gold) 35px, var(--gold) 36px);
  transition: opacity 0.3s ease;
}

/* ── NAME FORM ── */
#nameForm {
  display: flex; flex-direction: column; align-items: center; gap: 1rem;
  background: linear-gradient(135deg, var(--surface4), var(--surface));
  border: 2px solid var(--gold);
  padding: 2.2rem 1.8rem; border-radius: 22px;
  max-width: 420px; margin: 2rem auto;
  box-shadow: 0 12px 35px var(--card-shadow);
  position: relative; z-index: 1;
}

.hero-text {
  font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold);
  letter-spacing: 2px; text-align: center;
}
.hero-author { text-align: center; font-size: 22px; margin-top: 4px; }

#nameInput, #departmentSelect {
  width: 100%; padding: 0.9rem 1rem;
  background: var(--input-bg); border: 2px solid var(--border3);
  border-radius: 12px; font-family: 'Cinzel', serif;
  color: var(--text); letter-spacing: 1px;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
#nameInput::placeholder { color: var(--gold-faint); }
#nameInput:focus, #departmentSelect:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--surface3);
}
#departmentSelect option { background: var(--bg); color: var(--text); }

#nameForm button {
  width: 100%; padding: 1rem;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--bg); border: none; border-radius: 14px;
  font-family: 'Cinzel', serif; font-weight: 700;
  letter-spacing: 2px; cursor: pointer;
  transition: opacity 0.2s;
}
#nameForm button:hover { opacity: 0.88; }

/* ── LAYOUT ── */
.container { max-width: 1500px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

/* ── HEADER ── */
header { text-align: center; padding: 20px 20px 12px; }

h1 {
  font-family: 'Cinzel', serif; font-size: clamp(1.4rem,3vw,2.2rem);
  font-weight: 700; letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { margin-top: 8px; color: var(--gold); letter-spacing: 4px; font-size: 0.85rem; }

/* ── HEADER ROW (HOW TO PLAY + THEME) ── */
.header-actions {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 14px;
}
.solve-btn {
  padding: 6px 15px; border: 1.5px solid var(--gold);
  background: transparent; color: var(--gold);
  font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 11px;
  letter-spacing: 1px; text-decoration: none; transition: all 0.2s;
  clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  display: inline-block;
}
.solve-btn:hover { background: var(--gold); color: var(--bg); }

/* ── THEME TOGGLE ── */
.theme-toggle {
  font-size: 15px; cursor: pointer;
  background: var(--surface2); border: 1.5px solid var(--border2);
  color: var(--gold); padding: 6px 10px;
  clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  transition: background 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent; user-select: none; line-height: 1;
}
.theme-toggle:hover { background: var(--surface3); transform: scale(1.08); }
.theme-toggle:active { transform: scale(0.93); }

.player-bar {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 16px; padding: 8px 20px;
  background: var(--surface2); border: 1px solid var(--border2);
  clip-path: polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.player-bar-name { font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold); letter-spacing: 1px; }
.player-bar-change {
  font-size: 12px; color: var(--gold-dim); cursor: pointer;
  text-decoration: underline; transition: color 0.2s;
}
.player-bar-change:hover { color: var(--gold); }

.main-layout { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }

/* ── FILTER CONTROLS ── */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: flex-start; margin: 0 0 24px;
}
.filter-btn {
  padding: 10px 18px; border: 2px solid var(--gold);
  background: transparent; color: var(--gold);
  font-family: 'Raleway', sans-serif; font-weight: 600;
  font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
  clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
.filter-btn.active, .filter-btn:hover { background: var(--gold); color: var(--bg); }

/* ── CLUE GRID ── */
.clue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px,1fr)); gap: 20px; }

/* ── CARDS ── */
.clue-card {
  border: 2px solid var(--gold); padding: 20px; position: relative;
  background: var(--surface); transition: transform 0.3s, box-shadow 0.3s;
  clip-path: polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
}
.clue-card:hover { transform: translateY(-5px); box-shadow: 0 10px 26px var(--card-shadow); }
.clue-num {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--gold); color: var(--bg);
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.clue-text { font-size: 15px; line-height: 1.6; margin-bottom: 13px; padding-right: 48px; color: var(--text); }
.clue-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 3px 8px; border: 1px solid var(--gold); color: var(--gold); letter-spacing: 1px; }
.clue-footer {
  margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.clue-date { font-size: 12px; color: var(--gold-dim); }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .clue-grid   { grid-template-columns: 1fr; }
  .clue-footer { flex-direction: column; align-items: stretch; }
  .solve-btn   { text-align: center; display: block; }
  #nameForm    { padding: 36px 22px; }
}
</style>
</head>
<body>

<div class="bg-pattern"></div>

<div id="nameForm">
  <div class="hero-quote">
    <div class="hero-text">Ready for a mental duel?</div>
    <div class="hero-author">🧩✨</div>
  </div>

  <input type="text" id="nameInput" placeholder="Enter your name"/>

  <select id="departmentSelect">
    <option value="">-- Select Department --</option>
<option value="Friends and Family">Friends and Family</option>
    <option value="Cyber Security">Cyber Security</option>
    <option value="EIE">EIE</option>
    <option value="CSE-1">CSE-1</option>
    <option value="CSE-2">CSE-2</option>
    <option value="CSE-3">CSE-3</option>
    <option value="Mechanical Engineering">Mechanical Engineering</option>
    <option value="ECE-1">ECE-1</option>
    <option value="ECE-2">ECE-2</option>
    <option value="ECE-3">ECE-3</option>
    <option value="AI DS-1">AI DS-1</option>
    <option value="AI DS-2">AI DS-2</option>
    <option value="Agri and Civil">Agri and Civil</option>
    <option value="EEE">EEE</option>
    <option value="Medical Electronics">Medical Electronics</option>
    <option value="IT-1">IT-1</option>
    <option value="IT-2">IT-2</option>
  </select>

  <button onclick="beginApp()">Begin Solving</button>
</div>

<div class="container">
  <header>
    <h1>CRYPTIC CLUES</h1>
    <div class="subtitle">Miniature Turing Tests</div>
    <div class="header-actions">
      <a href="https://andrewveda.github.io/cryptic/instruction" target="_blank" class="solve-btn" style="padding:8px 20px;letter-spacing:2px;font-size:12px;">HOW TO PLAY →</a>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
    </div>
    <br>
    <div class="player-bar">
      <span class="player-bar-name" id="playerBarName">👤 Guest</span>
      <span class="player-bar-change" onclick="document.getElementById('nameForm').style.display='flex'">change</span>
    </div>
  </header>

  <div class="main-layout">
    <div>
      <div class="controls">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="anagram">ANAGRAM</button>
        <button class="filter-btn" data-filter="acrostic">ACROSTIC</button>
        <button class="filter-btn" data-filter="charade">CHARADE</button>
        <button class="filter-btn" data-filter="hidden">HIDDEN</button>
        <button class="filter-btn" data-filter="homophone">HOMOPHONE</button>
        <button class="filter-btn" data-filter="double">DOUBLE DEF</button>
      </div>
      <div id="clueGrid" class="clue-grid"></div>
    </div>
  </div>
</div>

<script>
const NAME_KEY  = 'questPlayerName';
const DEPT_KEY  = 'questPlayerDept';
const THEME_KEY = 'crypticTheme';

let playerName = "";
let playerDept = "";

/* ── THEME ── */
function applyTheme(t) {
  document.documentElement.classList.toggle('light', t === 'light');
  document.getElementById('themeToggle').textContent = t === 'light' ? '🌙' : '☀️';
}
function toggleTheme() {
  const next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

/* ── NAME FORM ── */
function setDisplay(name, dept) {
  document.getElementById('playerBarName').textContent = `👤 ${name} · ${dept}`;
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') beginApp();
});

function beginApp() {
  const nameField = document.getElementById("nameInput");
  const deptField = document.getElementById("departmentSelect");
  if (!nameField.value.trim()) { alert("Please enter your name!"); return; }
  if (!deptField.value)        { alert("Please select your department!"); return; }
  playerName = nameField.value.trim();
  playerDept = deptField.value;
  localStorage.setItem(NAME_KEY, playerName);
  localStorage.setItem(DEPT_KEY, playerDept);
  document.getElementById("nameForm").style.display = "none";
  setDisplay(playerName, playerDept);
}

window.addEventListener("load", () => {
  const savedName = localStorage.getItem(NAME_KEY);
  const savedDept = localStorage.getItem(DEPT_KEY);
  if (savedName && savedDept) {
    playerName = savedName;
    playerDept = savedDept;
    document.getElementById("nameForm").style.display = "none";
    setDisplay(playerName, playerDept);
  } else {
    document.getElementById("nameForm").style.display = "flex";
  }
});

/* ── PUZZLE DATA ── */
let clues = [];
let currentFilter = 'all';

async function loadClues() {
  try {
    const res = await fetch('/cryptic/puzzles/puzzles.json');
    clues = await res.json();
    clues.sort((a, b) => b.id - a.id);
    render();
  } catch(e) {
    document.getElementById('clueGrid').innerHTML =
      '<p style="color:rgba(212,175,55,0.45);padding:40px;text-align:center;font-family:Cinzel,serif;letter-spacing:2px;">Could not load puzzles.</p>';
  }
}

function render() {
  const filtered = clues.filter(c => {
    if (currentFilter === 'all') return true;
    return c.type.split(',').map(t => t.trim().toLowerCase()).includes(currentFilter);
  });
  document.getElementById('clueGrid').innerHTML = filtered.map(c => `
    <div class="clue-card">
      <div class="clue-num">${c.id}</div>
      <div class="clue-text">${c.clue}</div>
      <div class="clue-meta">
        <span class="tag">${c.type.toUpperCase()}</span>
        <span class="tag">${c.difficulty.toUpperCase()}</span>
      </div>
      <div class="clue-footer">
        <span class="clue-date">${c.date}</span>
        <a class="solve-btn" href="puzzles/puzzle.html?id=${c.id}">SOLVE →</a>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

loadClues();
</script>
</body>
</html>
