<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a0a">
<title>Cryptic Puzzle</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Raleway', sans-serif;
  background: #0a0a0a;
  color: #f5f5f5;
  min-height: 100vh;
  text-align: center;
}

.page {
  max-width: 600px;
  margin: auto;
  padding: 30px 16px 40px;
}

/* Header */
header {
  padding: 40px 10px 20px;
}

.date {
  font-family: 'Cinzel', serif;
  font-size: 30px;
  color: #d4af37;
}

.author {
  margin-top: 6px;
  letter-spacing: 2px;
  color: #d4af37;
}

.difficulty-tag {
  margin-top: 10px;
  display: inline-block;
  padding: 6px 16px;
  border: 1px solid #d4af37;
  color: #d4af37;
  font-size: 12px;
  letter-spacing: 2px;
}

/* Clue */
.clue {
  margin: 40px 0 30px;
  padding: 26px;
  border: 2px solid #d4af37;
  font-size: 20px;
  line-height: 1.6;
}

/* ANSWER ROW — FLEX = PERFECT CENTRING */
.answer-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin: 30px 0;
}

/* Cells */
.cell {
  width: 42px;
  height: 52px;
  font-family: 'Cinzel', serif;
  font-size: 26px;
  text-align: center;
  border: 3px solid #d4af37;
  background: rgba(212,175,55,0.08);
  color: #fff;
  text-transform: uppercase;
}

.cell:focus {
  outline: none;
  box-shadow: 0 0 14px rgba(212,175,55,0.5);
}

/* Visual space */
.spacer {
  width: 18px;
  height: 1px;
  border-left: 1px solid rgba(212,175,55,0.5);
}

/* Buttons */
.hint-buttons, .controls {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

button {
  padding: 12px 22px;
  background: transparent;
  border: 2px solid #d4af37;
  color: #d4af37;
  cursor: pointer;
  font-weight: 600;
}

.controls button {
  background: #d4af37;
  color: #0a0a0a;
  font-size: 18px;
  padding: 14px 40px;
}

/* Hint box */
.hint-output {
  display: none;
  margin: 20px auto;
  padding: 18px;
  max-width: 480px;
  border: 2px solid #d4af37;
}
</style>
</head>

<body>

<div class="page">

<header>
  <div class="date" id="puzzleDate">2026-01-14</div>
  <div class="author">By Andrew Veda</div>
  <div class="difficulty-tag">MEDIUM</div>
</header>

<div class="clue" id="puzzleClue">
  XX with headless light party or used to beat a classic cult (5,4)
</div>

<div class="answer-row" id="answerRow"></div>

<div class="hint-buttons">
  <button id="defBtn">DEFINITION</button>
  <button id="fodderBtn">FODDER</button>
  <button id="indicatorBtn">INDICATOR</button>
</div>

<div class="hint-output" id="hintOutput"></div>

<div class="controls">
  <button id="checkBtn">CHECK ANSWER</button>
</div>

</div>

<script>
/* === PUZZLE DATA === */
const ANSWER = "FIGHTCLUB";
const DEFINITION = "a classic cult";
const FODDER = "XX light party";
const INDICATOR = "with, headless";

/* === ENUMERATION PARSER === */
function getWordBreaks(clue) {
  const match = clue.match(/\(([\d,]+)\)/);
  if (!match) return [];
  const nums = match[1].split(',').map(Number);
  let sum = 0, breaks = [];
  for (let i = 0; i < nums.length - 1; i++) {
    sum += nums[i];
    breaks.push(sum);
  }
  return breaks;
}

/* === BUILD GRID === */
const answerRow = document.getElementById("answerRow");
const clueText = document.getElementById("puzzleClue").textContent;
const BREAKS = getWordBreaks(clueText);

let cells = [];

for (let i = 0; i < ANSWER.length; i++) {

  if (BREAKS.includes(i)) {
    const spacer = document.createElement("div");
    spacer.className = "spacer";
    answerRow.appendChild(spacer);
  }

  const input = document.createElement("input");
  input.className = "cell";
  input.maxLength = 1;
  input.type = "text";

  input.addEventListener("input", () => {
    input.value = input.value.toUpperCase();
    const idx = cells.indexOf(input);
    if (idx < cells.length - 1 && input.value) cells[idx + 1].focus();
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !input.value) {
      const idx = cells.indexOf(input);
      if (idx > 0) cells[idx - 1].focus();
    }
  });

  cells.push(input);
  answerRow.appendChild(input);
}

cells[0].focus();

/* === HINTS === */
const hintOutput = document.getElementById("hintOutput");
const showHint = t => {
  hintOutput.style.display = "block";
  hintOutput.textContent = t;
};

defBtn.onclick = () => showHint("Definition: " + DEFINITION);
fodderBtn.onclick = () => showHint("Fodder: " + FODDER);
indicatorBtn.onclick = () => showHint("Indicator: " + INDICATOR);

/* === CHECK === */
checkBtn.onclick = () => {
  const guess = cells.map(c => c.value).join("");
  if (guess === ANSWER) {
    alert("Correct! 🎉");
  } else {
    alert("Try again.");
  }
};
</script>

</body>
</html>
