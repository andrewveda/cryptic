<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<title>Cryptic Clues</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Raleway', sans-serif;
  background: #0a0a0a; color: #f5f5f5; overflow-x: hidden;
}

.bg-pattern {
  position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 35px, #d4af37 35px, #d4af37 36px),
    repeating-linear-gradient(-45deg, transparent, transparent 35px, #d4af37 35px, #d4af37 36px);
}

/* ── NAME MODAL ── */
.name-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.97);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.name-card {
  background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.04));
  border: 2px solid #d4af37; padding: 50px 40px; max-width: 440px; width: 100%;
  clip-path: polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);
  text-align: center;
  animation: cardUp 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes cardUp {
  from { opacity:0; transform:translateY(32px) scale(0.92); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
.name-logo {
  font-family: 'Cinzel', serif; font-size: clamp(26px,5vw,38px); font-weight: 700;
  background: linear-gradient(135deg, #d4af37, #f4e5b1, #d4af37);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 3px; margin-bottom: 6px;
}
.name-sub { color: rgba(212,175,55,0.55); letter-spacing: 3px; font-size: 11px; margin-bottom: 34px; }
.name-prompt {
  font-family: 'Cinzel', serif; font-size: 15px; color: #f5f5f5;
  letter-spacing: 2px; margin-bottom: 20px;
}
.name-input {
  width: 100%; padding: 14px 18px; margin-bottom: 12px;
  background: rgba(212,175,55,0.07); border: 2px solid rgba(212,175,55,0.4);
  color: #f5f5f5; font-family: 'Cinzel', serif; font-size: 16px;
  letter-spacing: 2px; text-align: center; outline: none;
  clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  transition: border-color 0.3s;
}
.name-input:focus  { border-color: #d4af37; }
.name-input::placeholder { color: rgba(212,175,55,0.28); }
.name-submit {
  width: 100%; padding: 15px; background: #d4af37; color: #0a0a0a;
  border: none; font-family: 'Cinzel', serif; font-weight: 700;
  font-size: 15px; letter-spacing: 3px; cursor: pointer;
  clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition: background 0.2s; margin-bottom: 14px;
}
.name-submit:hover { background: #f4e5b1; }
.name-guest {
  background: none; border: none; color: rgba(212,175,55,0.4);
  font-size: 13px; cursor: pointer; letter-spacing: 1px;
  transition: color 0.2s; font-family: 'Raleway', sans-serif;
}
.name-guest:hover { color: #d4af37; }

/* ── LAYOUT ── */
.container { max-width: 1500px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

/* ── HEADER ── */
header { text-align: center; padding: 60px 20px 30px; }
h1 {
  font-family: 'Cinzel', serif; font-size: clamp(2.5rem,6vw,5rem);
  font-weight: 700; letter-spacing: 4px;
  background: linear-gradient(135deg, #d4af37, #f4e5b1, #d4af37);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { margin-top: 8px; color: #d4af37; letter-spacing: 4px; font-size: 0.85rem; }

.player-bar {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 16px; padding: 8px 20px;
  background: rgba(212,175,55,0.07); border: 1px solid rgba(212,175,55,0.3);
  clip-path: polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.player-bar-name { font-family: 'Cinzel', serif; font-size: 14px; color: #d4af37; letter-spacing: 1px; }
.player-bar-change {
  font-size: 12px; color: rgba(212,175,55,0.5); cursor: pointer;
  text-decoration: underline; transition: color 0.2s;
}
.player-bar-change:hover { color: #d4af37; }

/* ── MAIN LAYOUT ── */
.main-layout { display: grid; grid-template-columns: 1fr 290px; gap: 28px; align-items: start; }
@media (max-width: 1024px) {
  .main-layout { grid-template-columns: 1fr; }
  .side-panel  { order: -1; }
}

/* ── FILTER CONTROLS ── */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: flex-start; margin: 0 0 24px;
}
.filter-btn {
  padding: 10px 18px; border: 2px solid #d4af37;
  background: transparent; color: #d4af37;
  font-family: 'Raleway', sans-serif; font-weight: 600;
  font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
  clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
.filter-btn.active, .filter-btn:hover { background: #d4af37; color: #0a0a0a; }

/* ── CLUE GRID ── */
.clue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px,1fr)); gap: 20px; }

/* ── CARDS ── */
.clue-card {
  border: 2px solid #d4af37; padding: 20px; position: relative;
  background: rgba(212,175,55,0.04); transition: transform 0.3s, box-shadow 0.3s;
  clip-path: polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
}
.clue-card:hover { transform: translateY(-5px); box-shadow: 0 10px 26px rgba(212,175,55,0.1); }
.clue-num {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px; border-radius: 50%;
  background: #d4af37; color: #0a0a0a;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.clue-text { font-size: 15px; line-height: 1.6; margin-bottom: 13px; padding-right: 48px; }
.clue-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 3px 8px; border: 1px solid #d4af37; color: #d4af37; letter-spacing: 1px; }
.clue-footer {
  margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(212,175,55,0.22);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.clue-date { font-size: 12px; color: rgba(212,175,55,0.55); }
.solve-btn {
  padding: 6px 15px; border: 1.5px solid #d4af37;
  background: transparent; color: #d4af37;
  font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 11px;
  letter-spacing: 1px; text-decoration: none; transition: all 0.2s;
  clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
}
.solve-btn:hover { background: #d4af37; color: #0a0a0a; }

/* ── SIDE PANEL ── */
.side-panel {
  position: sticky; top: 20px;
  border: 2px solid #d4af37; background: rgba(212,175,55,0.04);
  clip-path: polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
}
.panel-header {
  padding: 15px 18px; border-bottom: 1px solid rgba(212,175,55,0.22);
  display: flex; align-items: center; gap: 9px;
}
.panel-title { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; color: #d4af37; letter-spacing: 2px; }
.panel-body  { padding: 24px 18px; text-align: center; }
.panel-desc  { font-size: 13px; color: rgba(212,175,55,0.55); line-height: 1.6; margin-bottom: 20px; }
.panel-btn {
  display: block; padding: 12px 16px; background: #d4af37; color: #0a0a0a;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 2px;
  text-decoration: none; transition: background 0.2s;
  clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.panel-btn:hover { background: #f4e5b1; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .clue-grid   { grid-template-columns: 1fr; }
  .clue-footer { flex-direction: column; align-items: stretch; }
  .solve-btn   { text-align: center; display: block; }
  .side-panel  { position: static; }
  .name-card   { padding: 36px 22px; }
}
</style>
</head>
<body>

<div class="bg-pattern"></div>

<!-- ── NAME MODAL ── -->
<div class="name-modal" id="nameModal" style="display:none">
  <div class="name-card">
    <div class="name-logo">CRYPTIC CLUES</div>
    <div class="name-sub">MASTERFUL PUZZLES • TIMELESS ELEGANCE</div>
    <div class="name-prompt">Who's solving today?</div>
    <input class="name-input" id="nameInput" type="text" maxlength="24"
           placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
    <button class="name-submit" id="nameSubmit">BEGIN SOLVING</button>
    <button class="name-guest"  id="nameGuest">Continue as Guest</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>CRYPTIC CLUES</h1>
    <div class="subtitle">MASTERFUL PUZZLES • TIMELESS ELEGANCE</div>
    <div class="player-bar">
      <span class="player-bar-name" id="playerBarName">👤 Guest</span>
      <span class="player-bar-change" onclick="showNameModal()">change</span>
    </div>
  </header>

  <div class="main-layout">
    <div>
      <div class="controls">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="anagram">ANAGRAM</button>
        <button class="filter-btn" data-filter="acrostic">ACROSTIC</button>
        <button class="filter-btn" data-filter="charade">CHARADE</button>
        <button class="filter-btn" data-filter="hidden">HIDDEN</button>
        <button class="filter-btn" data-filter="homophone">HOMOPHONE</button>
        <button class="filter-btn" data-filter="double">DOUBLE DEF</button>
      </div>
      <div id="clueGrid" class="clue-grid"></div>
    </div>

    <div class="side-panel">
      <div class="panel-header">
        <span>🏆</span>
        <span class="panel-title">LEADERBOARD</span>
      </div>
      <div class="panel-body">
        <p class="panel-desc">See how your solve times and hint counts stack up against everyone else.</p>
        <a class="panel-btn"
           href="https://andrewveda.github.io/SRM-VEC-English-PWA/buttons/leaderboard_live"
           target="_blank">VIEW LEADERBOARD →</a>
      </div>
    </div>
  </div>
</div>

<script>
const NAME_KEY = 'cryptic-player-name';

/* ── NAME ── */
function initName() {
  const saved = localStorage.getItem(NAME_KEY);
  if (!saved) showNameModal();
  else setDisplay(saved);
}
function showNameModal() {
  document.getElementById('nameModal').style.display = 'flex';
  const saved = localStorage.getItem(NAME_KEY) || '';
  document.getElementById('nameInput').value = saved;
  setTimeout(() => document.getElementById('nameInput').focus(), 80);
}
function saveName(raw) {
  const name = raw.trim() || 'Guest';
  localStorage.setItem(NAME_KEY, name);
  setDisplay(name);
  document.getElementById('nameModal').style.display = 'none';
}
function setDisplay(name) {
  document.getElementById('playerBarName').textContent = `👤 ${name}`;
}

document.getElementById('nameSubmit').onclick = () => saveName(document.getElementById('nameInput').value);
document.getElementById('nameGuest').onclick  = () => saveName('Guest');
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveName(document.getElementById('nameInput').value);
});

/* ── PUZZLE DATA ── */
let clues = [];
let currentFilter = 'all';

async function loadClues() {
  try {
    const res = await fetch('puzzles.json');
    clues = await res.json();
    clues.sort((a, b) => b.id - a.id);
    render();
  } catch(e) {
    document.getElementById('clueGrid').innerHTML =
      '<p style="color:rgba(212,175,55,0.45);padding:40px;text-align:center;font-family:Cinzel,serif;letter-spacing:2px;">Could not load puzzles.</p>';
  }
}

function render() {
  const filtered = clues.filter(c => {
    if (currentFilter === 'all') return true;
    return c.type.split(',').map(t => t.trim().toLowerCase()).includes(currentFilter);
  });
  document.getElementById('clueGrid').innerHTML = filtered.map(c => `
    <div class="clue-card">
      <div class="clue-num">${c.id}</div>
      <div class="clue-text">${c.clue}</div>
      <div class="clue-meta">
        <span class="tag">${c.type.toUpperCase()}</span>
        <span class="tag">${c.difficulty.toUpperCase()}</span>
      </div>
      <div class="clue-footer">
        <span class="clue-date">${c.date}</span>
        <a class="solve-btn" href="puzzles/puzzle.html?id=${c.id}">SOLVE →</a>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

initName();
loadClues();
</script>
</body>
</html>
