<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cryptic Puzzle</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Raleway', sans-serif;
  background: #0a0a0a;
  color: #f5f5f5;
  text-align: center;
  min-height: 100vh;
}

.bg-pattern {
  position: fixed;
  inset: 0;
  opacity: 0.03;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 35px, #d4af37 35px, #d4af37 36px),
    repeating-linear-gradient(-45deg, transparent, transparent 35px, #d4af37 35px, #d4af37 36px);
}

.page {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  position: relative;
  z-index: 1;
}

/* Header */
header { padding: 60px 10px 30px; }

.puzzle-number {
  font-family: 'Cinzel', serif;
  font-size: 14px;
  color: #d4af37;
  letter-spacing: 3px;
}

.date {
  font-family: 'Cinzel', serif;
  font-size: 30px;
  font-weight: 700;
  background: linear-gradient(135deg, #d4af37, #f4e5b1, #d4af37);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.author {
  font-size: 16px;
  color: #d4af37;
  letter-spacing: 2px;
}

.difficulty-tag {
  margin-top: 10px;
  display: inline-block;
  padding: 6px 16px;
  border: 1px solid #d4af37;
  color: #d4af37;
  font-size: 12px;
  letter-spacing: 2px;
}

/* Clue */
.clue {
  margin: 40px 0;
  padding: 30px;
  font-size: 20px;
  line-height: 1.6;
  border: 2px solid #d4af37;
  background: rgba(212,175,55,0.08);
}

/* Highlights */
.highlight-def { color: #7dd3fc; text-shadow: 0 0 8px rgba(125,211,252,.6); }
.highlight-fodder { color: #f472b6; text-shadow: 0 0 8px rgba(244,114,182,.6); }
.highlight-indicator { color: #facc15; text-shadow: 0 0 8px rgba(250,204,21,.6); }

/* Answer boxes */
.answer-row {
  display: grid;
  grid-template-columns: repeat(var(--letters), 1fr);
  gap: 8px;
  margin: 30px auto;
}

.cell {
  aspect-ratio: 4/5;
  font-size: 26px;
  font-family: 'Cinzel', serif;
  text-align: center;
  border: 3px solid #d4af37;
  background: transparent;
  color: #f5f5f5;
  text-transform: uppercase;
}

.cell.correct {
  background: rgba(212,175,55,.35);
}

/* Hint buttons */
.hint-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.hint-buttons button {
  padding: 10px 18px;
  border: 2px solid #d4af37;
  background: transparent;
  color: #d4af37;
  cursor: pointer;
}

.hint-output {
  margin: 20px;
  padding: 16px;
  border: 2px solid #d4af37;
  display: none;
}

/* Controls */
.controls { margin-top: 30px; }

.controls button,
.controls a {
  display: inline-block;
  padding: 14px 40px;
  border: 2px solid #d4af37;
  background: transparent;
  color: #d4af37;
  font-weight: 700;
  letter-spacing: 2px;
  text-decoration: none;
  cursor: pointer;
}

.controls button:hover,
.controls a:hover {
  background: #d4af37;
  color: #0a0a0a;
}

#solutionLink { display: none; margin-top: 12px; }
</style>
</head>

<body>

<div class="bg-pattern"></div>

<div class="page">
  <header>
    <div class="puzzle-number" id="puzzleNumber"></div>
    <div class="date" id="puzzleDate"></div>
    <div class="author" id="puzzleAuthor"></div>
    <div class="difficulty-tag" id="puzzleDifficulty"></div>
  </header>

  <div class="clue" id="puzzleClue"></div>

  <div class="answer-row" id="answerRow"></div>

  <div class="hint-buttons">
    <button id="defBtn">DEFINITION</button>
    <button id="fodderBtn">FODDER</button>
    <button id="indicatorBtn">INDICATOR</button>
  </div>

  <div class="hint-output" id="hintOutput"></div>

  <div class="controls">
    <button id="checkBtn">CHECK ANSWER</button>
  </div>

  <div class="controls">
    <a id="solutionLink">VIEW SOLUTION</a>
  </div>
</div>

<script>
let ANSWER="", DEFINITION="", FODDER="", INDICATOR="", RAW_CLUE="", id=null;

/* Load puzzle */
async function loadPuzzle() {
  id = new URLSearchParams(location.search).get("id");
  if (!id) return alert("Invalid puzzle link");

  const res = await fetch(`./${id}.json`);
  const p = await res.json();

  ANSWER = p.answer.toUpperCase();
  DEFINITION = p.definition;
  FODDER = p.fodder;
  INDICATOR = p.indicator;

  document.getElementById("puzzleNumber").textContent = `PUZZLE ${p.id}`;
  document.getElementById("puzzleDate").textContent = p.date;
  document.getElementById("puzzleAuthor").textContent = "By " + p.author;
  document.getElementById("puzzleDifficulty").textContent = p.difficulty.toUpperCase();
  document.getElementById("puzzleClue").textContent = p.clue;

  RAW_CLUE = p.clue;
  document.documentElement.style.setProperty("--letters", ANSWER.length);
  buildInputs();

  document.getElementById("solutionLink").href = `solution.html?id=${id}`;
}

/* Build inputs */
function buildInputs() {
  const row = document.getElementById("answerRow");
  row.innerHTML = "";
  for (let i=0;i<ANSWER.length;i++) {
    const c=document.createElement("input");
    c.className="cell"; c.maxLength=1;
    c.oninput=()=>{c.value=c.value.toUpperCase();c.nextElementSibling?.focus();}
    c.onkeydown=e=>{if(e.key==="Backspace"&&!c.value)c.previousElementSibling?.focus();}
    row.appendChild(c);
  }
}

/* Hint logic */
function highlight(text, cls) {
  const el=document.getElementById("puzzleClue");
  el.innerHTML=RAW_CLUE.replace(new RegExp(text,"i"),`<span class="${cls}">$&</span>`);
}

const out=document.getElementById("hintOutput");
defBtn.onclick=()=>{out.style.display="block";out.textContent="Definition: "+DEFINITION;highlight(DEFINITION,"highlight-def");}
fodderBtn.onclick=()=>{out.style.display="block";out.textContent="Fodder: "+FODDER;highlight(FODDER,"highlight-fodder");}
indicatorBtn.onclick=()=>{out.style.display="block";out.textContent="Indicator: "+INDICATOR;highlight(INDICATOR,"highlight-indicator");}

/* Check */
checkBtn.onclick=()=>{
  const guess=[...document.querySelectorAll(".cell")].map(c=>c.value).join("");
  if(guess===ANSWER){
    document.querySelectorAll(".cell").forEach(c=>c.classList.add("correct"));
  }
  document.getElementById("solutionLink").style.display="inline-block";
};

loadPuzzle();
</script>

</body>
</html>
