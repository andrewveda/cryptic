<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Cryptic</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #cfe8ff;
    text-align: center;
  }

  header {
    padding: 16px;
  }

  .date {
    font-size: 20px;
    font-weight: bold;
  }

  .author {
    font-size: 16px;
    margin-bottom: 16px;
  }

  .clue {
    margin: 12px 20px;
    font-size: 18px;
  }

  .answer-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }

  .cell {
    width: 42px;
    height: 52px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    border-radius: 8px;
    border: none;
    background: #ffe9a8;
    text-transform: uppercase;
  }

  .controls {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 24px;
  }

  button {
    padding: 12px 26px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    background: #ffffff;
  }

  /* Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hidden {
    display: none;
  }

  .modal-content {
    background: white;
    padding: 24px;
    border-radius: 18px;
    width: 80%;
    max-width: 320px;
  }

  .modal-content h3 {
    margin-top: 0;
  }

  .modal-content button {
    width: 100%;
    margin-top: 10px;
  }
</style>
</head>

<body>

<header>
  <div class="date">2026-01-14</div>
  <div class="author">By Andrew Veda</div>
</header>

<div class="clue">
  I am last e4 Knight sleeping sound for determined growth. (7)
</div>

<div class="answer-row" id="answerRow"></div>

<div class="controls">
  <button id="hintBtn">Hints</button>
  <button id="checkBtn">Check</button>
</div>

<!-- Hints Modal -->
<div class="modal hidden" id="hintModal">
  <div class="modal-content">
    <h3>Select a hint</h3>
    <button id="defHint">Show definition</button>
    <button id="fodderHint">Show fodder</button>
    <button id="indicatorHint">Show indicator</button>
    <button id="letterHint">Reveal a letter</button>
    <button id="closeHint">Close</button>
  </div>
</div>

<script>
  /* === PUZZLE DATA === */
  const ANSWER = "MEEEENZ";
  const DEFINITION = "determined growth";
  const FODDER = " am e4 Knight sleeping sound)";
  const INDICATOR = "last e4 sound";

  /* === BUILD INPUT BOXES === */
  const answerRow = document.getElementById("answerRow");

  for (let i = 0; i < ANSWER.length; i++) {
    const input = document.createElement("input");
    input.className = "cell";
    input.maxLength = 1;
    input.type = "text";
    answerRow.appendChild(input);
  }

  const cells = document.querySelectorAll(".cell");

  /* === INPUT BEHAVIOUR === */
  cells.forEach((cell, index) => {
    cell.addEventListener("input", () => {
      cell.value = cell.value.toUpperCase();
      if (cell.value && index < cells.length - 1) {
        cells[index + 1].focus();
      }
    });

    cell.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !cell.value && index > 0) {
        cells[index - 1].focus();
      }
    });
  });

  cells[0].focus();

  /* === CHECK BUTTON === */
  document.getElementById("checkBtn").addEventListener("click", () => {
    const guess = Array.from(cells).map(c => c.value).join("");

    if (guess.length < ANSWER.length) {
      alert("Complete the word first!");
      return;
    }

    if (guess === ANSWER) {
      alert("Correct! Well solved.");
    } else {
      alert("Not quite. Try again.");
    }
  });

  /* === HINTS === */
  const modal = document.getElementById("hintModal");

  document.getElementById("hintBtn").onclick = () => {
    modal.classList.remove("hidden");
  };

  document.getElementById("closeHint").onclick = () => {
    modal.classList.add("hidden");
  };

  document.getElementById("defHint").onclick = () => {
    alert("Definition: " + DEFINITION);
  };

  document.getElementById("fodderHint").onclick = () => {
    alert("Fodder: " + FODDER);
  };

  document.getElementById("indicatorHint").onclick = () => {
    alert("Indicator: " + INDICATOR);
  };

  document.getElementById("letterHint").onclick = () => {
    for (let i = 0; i < cells.length; i++) {
      if (!cells[i].value) {
        cells[i].value = ANSWER[i];
        if (i < cells.length - 1) cells[i + 1].focus();
        break;
      }
    }
  };
</script>

</body>
</html>
