<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Cryptic</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
  <button class="icon">←</button>
  <div class="title">
    <div class="date">14 January, 2026</div>
    <div class="author">By Andrew Veda</div>
  </div>
  <button class="icon">ⓘ</button>
</header>

<section class="clue-card">
  <p class="clue">
    <span class="indicator">Original</span>
    Big <span class="fodder">Bad Wolf</span> is
    <span class="indicator">foremost</span>
    <span class="definition">huffing and puffing creature</span>
    (8)
  </p>
</section>

<section class="answer-row">
  <div class="cell">B</div>
  <div class="cell">L</div>
  <div class="cell">O</div>
  <div class="cell">W</div>
  <div class="cell active"></div>
  <div class="cell">I</div>
  <div class="cell">S</div>
  <div class="cell">H</div>
</section>

<section class="controls">
  <button class="hint-btn">Hints</button>
  <button class="check-btn">Check</button>
</section>

<div class="modal hidden" id="hintsModal">
  <div class="modal-content">
    <h3>Select a hint</h3>
    <button>Show indicators</button>
    <button>Show fodder</button>
    <button>Show definition</button>
    <button>Reveal letter</button>
    <button class="close">✕</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
