<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Cryptic</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="date" id="puzzle-date"></div>
    <div class="author" id="puzzle-author"></div>
  </header>

  <!-- CLUE -->
  <section class="clue-box">
    <p id="clue-text"></p>
    <span class="length" id="answer-length"></span>
  </section>

  <!-- ANSWER CELLS -->
  <section class="answer-box" id="answer-box">
    <!-- cells generated by JS -->
  </section>

  <!-- CONTROLS -->
  <section class="controls">
    <button id="hint-btn">Hints</button>
    <button id="check-btn">Check</button>
  </section>

  <!-- HINT MODAL -->
  <div class="modal hidden" id="hint-modal">
    <div class="modal-content">
      <h3>Hints</h3>
      <button id="show-definition">Show definition</button>
      <button id="show-fodder">Show fodder</button>
      <button id="show-indicators">Show indicators</button>
      <button id="reveal-letter">Reveal letter</button>
      <button id="close-modal">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
