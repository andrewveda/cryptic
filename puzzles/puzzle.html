<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cryptic Puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;600&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:          #0a0a0a;
  --bg2:         rgba(10,10,10,0.85);
  --bg3:         rgba(10,10,10,0.98);
  --surface:     rgba(212,175,55,0.04);
  --surface2:    rgba(212,175,55,0.08);
  --surface3:    rgba(212,175,55,0.12);
  --border:      rgba(212,175,55,0.2);
  --border2:     rgba(212,175,55,0.3);
  --border3:     rgba(212,175,55,0.4);
  --gold:        #d4af37;
  --gold-light:  #f4e5b1;
  --text:        #f0ede8;
  --text-dim:    rgba(240,237,232,0.65);
  --text-dimmer: rgba(240,237,232,0.45);
  --gold-dim:    rgba(212,175,55,0.5);
  --gold-dimmer: rgba(212,175,55,0.3);
  --gold-faint:  rgba(212,175,55,0.1);
  --gold-hint:   rgba(212,175,55,0.55);
  --modal-bg:    rgba(0,0,0,0.96);
  --modal-bg2:   rgba(0,0,0,0.9);
  --sep:         rgba(212,175,55,0.14);
}
html.light {
  --bg:          #f2ead6;
  --bg2:         rgba(242,234,214,0.92);
  --bg3:         rgba(242,234,214,0.99);
  --surface:     rgba(160,118,10,0.05);
  --surface2:    rgba(160,118,10,0.09);
  --surface3:    rgba(160,118,10,0.14);
  --border:      rgba(140,100,5,0.22);
  --border2:     rgba(140,100,5,0.35);
  --border3:     rgba(140,100,5,0.5);
  --gold:        #7a5900;
  --gold-light:  #a07800;
  --text:        #1e1400;
  --text-dim:    rgba(30,20,0,0.7);
  --text-dimmer: rgba(30,20,0,0.45);
  --gold-dim:    rgba(122,89,0,0.6);
  --gold-dimmer: rgba(122,89,0,0.35);
  --gold-faint:  rgba(122,89,0,0.1);
  --gold-hint:   rgba(122,89,0,0.65);
  --modal-bg:    rgba(220,205,170,0.97);
  --modal-bg2:   rgba(220,205,170,0.93);
  --sep:         rgba(122,89,0,0.16);
}

html, body { height: 100%; overflow: hidden; font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }

/* Grain texture */
body::after { content:''; position:fixed; inset:0; opacity:0.022; pointer-events:none; z-index:999; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size:160px; }

/* ── PROGRESS ── */
.prog { position:fixed; top:0; left:0; right:0; height:2px; background:var(--border); z-index:200; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 0.5s cubic-bezier(.4,0,.2,1); }

/* ── CHROME ── */
.chrome { position:fixed; top:10px; z-index:150; display:flex; align-items:center; gap:6px; }
.chrome-l { left:14px; }
.chrome-r { right:14px; }
.cbtn { background:var(--bg2); border:1px solid var(--border2); color:var(--gold); font-size:13px; padding:4px 10px; line-height:1.7; cursor:pointer; letter-spacing:.5px; clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); transition:background .2s,transform .15s; user-select:none; font-family:'Cinzel',serif; }
.cbtn:hover { background:var(--gold-faint); transform:scale(1.06); }
.cpos { font-family:'Cinzel',serif; font-size:10px; color:var(--gold-dim); letter-spacing:2px; }
.csolv { font-size:9px; color:var(--gold); background:var(--surface2); padding:2px 6px; border:1px solid var(--border); clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); }

/* ── NAV ARROWS ── */
.nav-arrow { position:fixed; top:50%; transform:translateY(-50%); width:34px; height:68px; background:var(--surface2); border:1px solid var(--border2); color:var(--gold); font-size:17px; cursor:pointer; z-index:100; display:flex; align-items:center; justify-content:center; transition:background .2s,border-color .2s,box-shadow .2s; -webkit-tap-highlight-color:transparent; user-select:none; }
.nav-arrow:hover:not(:disabled) { background:var(--gold-faint); border-color:var(--gold); box-shadow:0 0 14px rgba(212,175,55,.2); }
.nav-arrow:disabled { opacity:.12; cursor:not-allowed; pointer-events:none; }
.nav-arrow.left  { left:0;  clip-path:polygon(0 0,100% 8px,100% calc(100% - 8px),0 100%); }
.nav-arrow.right { right:0; clip-path:polygon(0 8px,100% 0,100% 100%,0 calc(100% - 8px)); }

/* ── SHELL: two columns ── */
#shell { display:flex; width:100vw; height:100vh; overflow:hidden; }

/* ── LEFT PANEL ── */
#pp { flex:0 0 70%; width:70%; height:100vh; overflow:hidden; display:flex; flex-direction:column; border-right:1px solid var(--sep); position:relative; }

/* ── RIGHT PANEL ── */
#gp { flex:0 0 30%; width:30%; height:100vh; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; background:var(--bg); scrollbar-width:thin; scrollbar-color:var(--border2) transparent; }
#gp::-webkit-scrollbar { width:3px; }
#gp::-webkit-scrollbar-thumb { background:var(--border2); }
.g-head { flex-shrink:0; padding:14px 16px 10px; border-bottom:1px solid var(--sep); font-family:'Cinzel',serif; font-size:9px; letter-spacing:3px; color:var(--gold-dimmer); text-transform:uppercase; text-align:center; }
.g-inner { flex:1; padding:0; }
.g-inner iframe { width:100% !important; }

/* ── PUZZLE GRID: 5 rows, no scroll ── */
#pg {
  flex:1; display:grid;
  grid-template-rows: auto 1fr auto auto auto;
  height:100%; overflow:hidden;
  padding:0 clamp(22px,3.2vw,50px);
  row-gap:0;
}

/* ── ROW 1: TOPBAR ── */
.topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 0 14px; border-bottom:1px solid var(--sep); flex-shrink:0; gap:14px; }
.tb-l { display:flex; flex-direction:column; gap:2px; min-width:0; }
.tb-title { font-family:'Cinzel',serif; font-size:clamp(13px,1.5vw,19px); font-weight:700; background:linear-gradient(120deg,var(--gold),var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; letter-spacing:1px; }
.home-title {
  position:relative;
  display:inline-flex;
  flex-direction:column;
  text-decoration:none;
  transition:transform .18s ease;
}

.home-title:hover {
  transform:translateY(-1px);
}

.home-hover {
  position:absolute;
  top:100%;
  left:0;
  margin-top:2px;
  font-family:'Raleway',sans-serif;
  font-size:9px;
  letter-spacing:1.5px;
  color:var(--gold-dim);
  opacity:0;
  transform:translateY(-4px);
  transition:opacity .18s ease, transform .18s ease;
  white-space:nowrap;
  pointer-events:none;
}

.home-title:hover .home-hover {
  opacity:1;
  transform:translateY(0);
}
  .tb-sub { font-size:9px; color:var(--gold-dimmer); letter-spacing:2px; text-transform:uppercase; white-space:nowrap; }
.tb-c { display:flex; align-items:center; gap:10px; flex:1; justify-content:center; }
.timer-wrap { display:flex; align-items:center; gap:10px; padding:7px 14px; background:var(--surface); border:1px solid var(--border); clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
.tval { font-family:'Cinzel',serif; font-size:clamp(14px,1.5vw,18px); font-weight:700; color:var(--gold); letter-spacing:2px; min-width:42px; transition:color .3s; }
.tval.amber  { color:#f59e0b; }
.tval.danger { color:#ef4444; animation:tpulse .65s ease-in-out infinite; }
@keyframes tpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.ttrack { width:70px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.tfill { height:100%; width:0%; background:var(--gold); transition:width 1s linear,background .4s; border-radius:2px; }
.tfill.amber  { background:#f59e0b; }
.tfill.danger { background:#ef4444; }
.tb-r { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0; }
.tb-player { font-family:'Cinzel',serif; font-size:clamp(9px,1vw,12px); color:var(--gold); letter-spacing:1px; white-space:nowrap; }
.tb-meta { display:flex; align-items:center; gap:7px; }
.diff-tag { font-size:9px; letter-spacing:2px; color:var(--gold-dim); border:1px solid var(--border); padding:2px 7px; clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); text-transform:uppercase; }
.hints-pill { font-family:'Cinzel',serif; font-size:9px; color:var(--gold-dim); letter-spacing:1px; }
.hints-pill strong { color:var(--gold); font-size:12px; }
.pchange { font-size:10px; color:var(--gold-dimmer); cursor:pointer; text-decoration:underline; transition:color .2s; }
.pchange:hover { color:var(--gold); }

/* ── ROW 2: CLUE (flex 1) ── */
.clue-row { display:flex; align-items:center; justify-content:center; padding:18px 0 14px; overflow:hidden; }
.clue-box { width:100%; padding:clamp(18px,2.2vh,30px) clamp(20px,2.5vw,36px); font-size:clamp(15px,1.85vw,21px); line-height:1.68; background:linear-gradient(135deg,var(--surface),var(--surface3)); border:1.5px solid var(--gold); clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px); position:relative; overflow:hidden; animation:fadeUp .5s ease-out .1s both; }
.clue-box::before { content:''; position:absolute; top:-2px; left:-100%; width:60%; height:100%; background:linear-gradient(90deg,transparent,var(--gold-faint),transparent); animation:shine 5s ease-in-out infinite; }
@keyframes shine { 0%,100%{left:-100%} 50%{left:140%} }

/* ── ROW 3: ANSWER + CHECK ── */
.ac-row { display:flex; align-items:stretch; gap:12px; padding:0 0 12px; animation:fadeUp .5s ease-out .22s both; }
.cells-wrap { display:grid; grid-template-columns:repeat(var(--letters),minmax(0,1fr)); gap:5px; flex:1; min-width:0; }
.cell { aspect-ratio:1; width:100%; text-align:center; font-size:clamp(13px,1.9vw,22px); font-weight:700; font-family:'Cinzel',serif; color:var(--text); text-transform:uppercase; background:var(--surface2); border:2px solid var(--border2); clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); transition:border-color .18s,background .18s,transform .14s,box-shadow .18s; -webkit-tap-highlight-color:transparent; }
.cell:focus { outline:none; background:var(--gold-faint); border-color:var(--gold); box-shadow:0 0 12px rgba(212,175,55,.28); transform:translateY(-2px) scale(1.07); }
.cell.correct { background:linear-gradient(135deg,var(--surface3),var(--gold-faint)); border-color:var(--gold-light); animation:ccorrect .45s ease-out; }
@keyframes ccorrect { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.cell.wrong { border-color:#ef4444; background:rgba(239,68,68,.15); animation:shake .42s ease-out; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.check-btn { flex-shrink:0; padding:0 clamp(14px,1.8vw,26px); background:var(--gold); color:var(--bg); border:none; font-family:'Cinzel',serif; font-weight:700; font-size:clamp(10px,1vw,13px); letter-spacing:2px; cursor:pointer; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); white-space:nowrap; position:relative; overflow:hidden; transition:background .2s; min-width:80px; }
.check-btn::before { content:''; position:absolute; inset:0; background:var(--gold-light); transform:translateX(-100%); transition:transform .32s ease; }
.check-btn:hover::before { transform:translateX(0); }
.check-btn span { position:relative; z-index:1; }

/* ── ROW 4: HINT BUTTONS ── */
.hbtns { display:flex; align-items:center; gap:7px; padding:0 0 10px; animation:fadeUp .5s ease-out .34s both; }
.hbtn { flex:1; padding:9px 4px; background:transparent; border:1px solid var(--border2); color:var(--gold-dim); font-family:'Raleway',sans-serif; font-weight:600; font-size:clamp(8px,.8vw,11px); letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); transition:all .2s; white-space:nowrap; text-align:center; position:relative; overflow:hidden; }
.hbtn::before { content:''; position:absolute; inset:0; background:var(--gold-faint); transform:scaleX(0); transform-origin:left; transition:transform .22s ease; }
.hbtn:hover:not(:disabled):not(.used)::before { transform:scaleX(1); }
.hbtn:hover:not(:disabled):not(.used) { border-color:var(--gold); color:var(--gold); }
.hbtn span { position:relative; z-index:1; }
.hbtn.used   { opacity:.35; border-color:var(--border); cursor:default; }
.hbtn.active { border-color:var(--gold); color:var(--gold); background:var(--gold-faint); }
#explainBtn { color:var(--gold-dimmer); border-color:var(--border); cursor:not-allowed; }
#explainBtn:disabled { opacity:.5; }
#explainBtn.unlocked { color:var(--gold); border-color:var(--gold); cursor:pointer; animation:eglow 2s ease-in-out 3; }
@keyframes eglow { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 11px rgba(212,175,55,.4)} }

/* ── ROW 5: HINT SLOT (reserved, fixed height, never shifts layout) ── */
.hint-slot { height:clamp(62px,8.5vh,92px); margin-bottom:14px; overflow:hidden; animation:fadeUp .5s ease-out .42s both; }
.hs-inner { height:100%; padding:11px 16px; background:linear-gradient(135deg,var(--surface2),var(--surface3)); border:1px solid var(--border2); clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); display:flex; flex-direction:column; justify-content:center; opacity:0; transition:opacity .25s ease; overflow:hidden; }
.hs-inner.vis { opacity:1; }
.hs-label { font-family:'Cinzel',serif; font-size:9px; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; margin-bottom:5px; flex-shrink:0; }
.hs-text  { font-size:clamp(11px,1.05vw,13px); color:var(--text-dim); line-height:1.55; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }

/* Clue highlights */
.hl-def       { color:#7dd3fc; }
.hl-fodder    { color:#f472b6; }
.hl-indicator { color:#facc15; }
html.light .hl-def       { color:#0369a1; }
html.light .hl-fodder    { color:#9d174d; }
html.light .hl-indicator { color:#92400e; }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

/* ── TOAST ── */
.toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--bg2); border:1px solid var(--gold); color:var(--text); font-size:13px; padding:10px 22px; letter-spacing:.8px; z-index:800; clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); opacity:0; pointer-events:none; transition:opacity .22s,transform .22s; white-space:nowrap; }
.toast.toast-error  { border-color:#ef4444; color:#ef4444; }
.toast.toast-warn   { border-color:#f59e0b; color:#f59e0b; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── SUCCESS MODAL ── */
.smodal { position:fixed; inset:0; background:var(--modal-bg); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
.smodal.on { display:flex; animation:mfade .3s ease-out; }
@keyframes mfade { from{opacity:0} to{opacity:1} }
.scontent { background:linear-gradient(135deg,var(--bg3),var(--surface)); border:2px solid var(--gold); padding:42px 34px; max-width:450px; width:100%; clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px); text-align:center; animation:mslide .44s cubic-bezier(.2,1,.4,1); overflow-y:auto; max-height:90vh; }
@keyframes mslide { from{opacity:0;transform:translateY(22px) scale(.94)} to{opacity:1;transform:none} }
.sicon  { font-size:58px; margin-bottom:12px; animation:spulse 1.1s ease-in-out infinite; }
@keyframes spulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.stitle { font-family:'Cinzel',serif; font-size:28px; color:var(--gold); margin-bottom:10px; letter-spacing:3px; }
.splayer{ font-size:14px; color:var(--text-dim); margin-bottom:4px; }
.sanswer{ font-family:'Cinzel',serif; font-size:22px; color:var(--gold-light); margin-bottom:6px; letter-spacing:4px; }
.smeta  { font-size:12px; color:var(--gold-dim); margin-bottom:18px; }
.srec   { font-size:11px; color:var(--gold); padding:7px 11px; border:1px solid var(--border2); margin-bottom:16px; clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); }
.sexp   { margin:0 0 18px; padding:14px 16px; background:var(--surface2); border:1px solid var(--border2); clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); text-align:left; }
.sexp-l { font-family:'Cinzel',serif; font-size:9px; letter-spacing:2px; color:var(--gold); margin-bottom:6px; display:block; text-transform:uppercase; }
.sexp-t { font-size:12px; color:var(--text-dim); line-height:1.7; }
.sbtns  { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.nbtn   { padding:12px 24px; background:var(--gold); color:var(--bg); border:none; font-family:'Cinzel',serif; font-weight:700; font-size:13px; letter-spacing:2px; cursor:pointer; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); transition:background .2s; flex:1; min-width:130px; }
.nbtn:hover { background:var(--gold-light); }
.nbtn.sec { background:transparent; border:1.5px solid var(--gold); color:var(--gold); }
.nbtn.sec:hover { background:var(--surface2); }

/* ── CONFIRM MODAL ── */
.cmodal { position:fixed; inset:0; background:var(--modal-bg2); display:none; align-items:center; justify-content:center; z-index:900; padding:20px; }
.cmodal.on { display:flex; animation:mfade .2s ease-out; }
.ccard  { background:var(--bg3); border:1.5px solid var(--gold); padding:30px 26px; max-width:330px; width:100%; text-align:center; clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px); animation:mslide .26s ease-out; }
.ctitle { font-family:'Cinzel',serif; font-size:15px; color:var(--gold); letter-spacing:2px; margin-bottom:9px; }
.ctext  { font-size:13px; color:var(--text-dimmer); margin-bottom:20px; line-height:1.6; }
.cbtns  { display:flex; gap:8px; justify-content:center; }
.cbtn2  { padding:9px 20px; border:1.5px solid var(--gold); color:var(--gold); background:transparent; font-family:'Raleway',sans-serif; font-weight:600; font-size:12px; letter-spacing:1px; cursor:pointer; clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); transition:all .2s; }
.cbtn2.yes { background:var(--gold); color:var(--bg); }
.cbtn2.yes:hover { background:var(--gold-light); }
.cbtn2.no:hover  { background:var(--surface2); }

/* ── LOADING ── */
#ls { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
.lspin { width:34px; height:34px; border:2.5px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .75s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.ltxt { font-family:'Cinzel',serif; color:var(--gold-hint); letter-spacing:3px; font-size:12px; }

/* ── SLIDE TRANSITIONS ── */
#pp.sol { animation:slideOL .26s ease-in forwards; }
#pp.sor { animation:slideOR .26s ease-in forwards; }
#pp.sir { animation:slideIR .26s ease-out forwards; }
#pp.sil { animation:slideIL .26s ease-out forwards; }
@keyframes slideOL { to{opacity:0;transform:translateX(-44px)} }
@keyframes slideOR { to{opacity:0;transform:translateX(44px)} }
@keyframes slideIR { from{opacity:0;transform:translateX(44px)} to{opacity:1;transform:none} }
@keyframes slideIL { from{opacity:0;transform:translateX(-44px)} to{opacity:1;transform:none} }

/* ── MOBILE ── */
@media (max-width:900px) {
  html,body { overflow:auto; height:auto; }
  #shell { flex-direction:column; height:auto; overflow:visible; }
  #pp { flex:none; width:100%; height:auto; overflow:visible; border-right:none; border-bottom:1px solid var(--sep); }
  #gp { flex:none; width:100%; height:auto; overflow:visible; }
  #pg { grid-template-rows:auto auto auto auto auto; height:auto; padding:0 14px; }
  .topbar { padding:48px 0 12px; flex-wrap:wrap; gap:8px; }
  .tb-c   { order:3; width:100%; justify-content:flex-start; }
  .ttrack { width:100%; flex:1; }
  .clue-row { padding:12px 0 10px; }
  .clue-box { font-size:17px; padding:16px 18px; clip-path:none; border-radius:10px; }
  .clue-box::before { display:none; }
  .ac-row   { padding:0 0 10px; gap:9px; }
  .cell     { clip-path:none; border-radius:6px; font-size:clamp(14px,4vw,20px); border-width:1.5px; }
  .check-btn { padding:0 16px; clip-path:none; border-radius:8px; font-size:12px; min-height:42px; }
  .hbtns { padding:0 0 10px; gap:5px; flex-wrap:wrap; }
  .hbtn  { font-size:9px; padding:7px 5px; clip-path:none; border-radius:6px; flex:1 1 calc(50% - 3px); }
  #explainBtn { flex:1 1 100%; }
  .hint-slot  { height:auto; min-height:56px; margin-bottom:12px; }
  .hs-inner   { clip-path:none; border-radius:8px; }
  .hs-text    { -webkit-line-clamp:4; font-size:13px; }
  .nav-arrow  { width:24px; height:48px; font-size:14px; opacity:.45; }
  #ls { position:static; min-height:200px; }
  #pp.sol,#pp.sor,#pp.sir,#pp.sil { animation:none; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="prog"><div class="prog-fill" id="progFill"></div></div>

<div class="chrome chrome-l">
  <button class="cbtn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
</div>
<div class="chrome chrome-r">
  <span class="cpos" id="cpos"></span>
  <span class="csolv" id="csolv" style="display:none"></span>
</div>

<button class="nav-arrow left"  id="navL" aria-label="Previous">&#8249;</button>
<button class="nav-arrow right" id="navR" aria-label="Next">&#8250;</button>

<div id="shell">

  <!-- LEFT: puzzle -->
  <div id="pp">
    <div id="ls">
      <div class="lspin"></div>
      <div class="ltxt">LOADING PUZZLE</div>
    </div>

    <div id="pg" style="display:none">

      <!-- TOPBAR -->
      <div class="topbar">
        <div class="tb-l">
         <a href="https://andrewveda.github.io/cryptic/"
   class="tb-title home-title"
   aria-label="Back to home">
  <span>Cryptic Clues</span>
  <span class="home-hover">← Back to home</span>
</a>
          <div class="tb-sub">Miniature Turing Tests</div>
        </div>
        <div class="tb-c">
          <div class="timer-wrap">
            <span class="tval" id="tval">0:00</span>
            <div class="ttrack"><div class="tfill" id="tfill"></div></div>
          </div>
        </div>
        <div class="tb-r">
          <div class="tb-player" id="tbPlayer"></div>
          <div class="tb-meta">
            <span class="diff-tag" id="diffTag"></span>
            <span class="hints-pill">💡 <strong id="hintsV">0</strong></span>
            <span class="pchange" onclick="changeName()">change</span>
          </div>
        </div>
      </div>

      <!-- CLUE -->
      <div class="clue-row">
        <div class="clue-box" id="clueBox"></div>
      </div>

      <!-- ANSWER + CHECK -->
      <div class="ac-row">
        <div class="cells-wrap" id="cellsWrap"></div>
        <button class="check-btn" id="checkBtn"><span>CHECK</span></button>
      </div>

      <!-- HINT BUTTONS -->
      <div class="hbtns">
        <button class="hbtn" id="defBtn"       onclick="showHint('def')"><span>DEFINITION</span></button>
        <button class="hbtn" id="fodderBtn"    onclick="showHint('fodder')"><span>FODDER</span></button>
        <button class="hbtn" id="indicatorBtn" onclick="showHint('indicator')"><span>INDICATOR</span></button>
        <button class="hbtn" id="explainBtn"   disabled onclick="showExplanation()">
          <span id="explainLbl">EXPLANATION 3:00</span>
        </button>
      </div>

      <!-- HINT SLOT: fixed-height reserved area, zero layout shift -->
      <div class="hint-slot">
        <div class="hs-inner" id="hsInner">
          <div class="hs-label" id="hsLabel"></div>
          <div class="hs-text"  id="hsText"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- RIGHT: giscus -->
  <div id="gp">
    <div class="g-head">Discussion</div>
    <div class="g-inner">
      <script src="https://giscus.app/client.js"
              data-repo="andrewveda/cryptic"
              data-repo-id="R_kgDOQ5jJ1Q"
              data-category="General"
              data-category-id="DIC_kwDOQ5jJ1c4C81sX"
              data-mapping="specific"
              data-term=""
              data-strict="1"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="transparent_dark"
              data-lang="en"
              crossorigin="anonymous"
              async>
      </script>
    </div>
  </div>

</div><!-- /shell -->

<!-- Success modal -->
<div class="smodal" id="successModal">
  <div class="scontent">
    <div class="sicon">✨</div>
    <div class="stitle">SOLVED!</div>
    <div class="splayer" id="sPlayer"></div>
    <div class="sanswer" id="sAnswer"></div>
    <div class="smeta"   id="sMeta"></div>
    <div class="srec"    id="sRec" style="display:none"></div>
    <div class="sexp"    id="sExp" style="display:none">
      <span class="sexp-l">How this clue works</span>
      <div class="sexp-t" id="sExpT"></div>
    </div>
    <div class="sbtns">
      <button class="nbtn" id="nextBtn" onclick="goNext()">NEXT PUZZLE →</button>
      <button class="nbtn sec" onclick="goBack()">ALL PUZZLES</button>
    </div>
  </div>
</div>

<!-- Confirm abandon -->
<div class="cmodal" id="confirmModal">
  <div class="ccard">
    <div class="ctitle">LEAVE PUZZLE?</div>
    <div class="ctext">You haven't solved this one yet. Your progress will be lost.</div>
    <div class="cbtns">
      <button class="cbtn2 yes" id="confirmYes">LEAVE</button>
      <button class="cbtn2 no" onclick="closeConfirm()">STAY</button>
    </div>
  </div>
</div>

<script>
const EDGE_URL = "https://yellow-lab-4999.andrewveda.workers.dev/functions/v1/logQuest";
const NK = "questPlayerName", DK = "questPlayerDept", SK = "crypticSolvedIds", TK = "crypticTheme";
const EXPLAIN_DELAY = 180;

/* THEME */
function applyTheme(t) {
  if (t === 'light') { document.documentElement.classList.add('light'); document.getElementById('themeToggle').textContent='🌙'; postGiscus({setConfig:{theme:'noborder_light'}}); }
  else               { document.documentElement.classList.remove('light'); document.getElementById('themeToggle').textContent='☀️'; postGiscus({setConfig:{theme:'transparent_dark'}}); }
}
function toggleTheme() { const n=document.documentElement.classList.contains('light')?'dark':'light'; localStorage.setItem(TK,n); applyTheme(n); }
function postGiscus(m) { const f=document.querySelector('#gp iframe.giscus-frame'); if(f) f.contentWindow.postMessage({giscus:m},'https://giscus.app'); }
applyTheme(localStorage.getItem(TK)||'dark');

/* TOAST */
let _tt;
function showToast(msg,type='',ms=2200) { const el=document.getElementById('toast'); el.textContent=msg; el.className='toast'+(type?' toast-'+type:''); void el.offsetWidth; el.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),ms); }

/* SOLVED */
function getSolved() { return (localStorage.getItem(SK)||'').split(',').map(Number).filter(Boolean); }
function markSolved(id) { const a=getSolved(); if(!a.includes(id)){a.push(id);localStorage.setItem(SK,a.join(','));} }

/* STATE */
let all=[], puzzle=null, idx=0, rawClue='';
let hintsUsed=0, t0=null, tH=null, eH=null;
let solved=false, expUnlocked=false, activeHint=null;
const hUsed={def:false,fodder:false,indicator:false};
let tx=0,ty=0,pendDir=null;

/* INIT */
(async()=>{
  const id=parseInt(new URLSearchParams(location.search).get('id'));
  if(!id) return showErr('No puzzle ID specified.');
  try {
    const r=await fetch('/cryptic/puzzles/puzzles.json');
    all=(await r.json()).sort((a,b)=>b.id-a.id);
    const i=all.findIndex(p=>p.id===id);
    if(i===-1) return showErr(`Puzzle #${id} not found.`);
    idx=i; puzzle=all[idx];
    build(); updateNav();
  } catch(e){showErr('Could not load puzzle data.');}
})();

function showErr(m) { document.getElementById('ls').innerHTML=`<div style="font-family:'Cinzel',serif;color:var(--gold-dim);letter-spacing:2px;font-size:13px;">${m}</div>`; }

/* NAV UI */
function updateNav() {
  const tot=all.length;
  document.getElementById('navL').disabled = idx<=0;
  document.getElementById('navR').disabled = idx>=tot-1;
  document.getElementById('cpos').textContent=`${idx+1} / ${tot}`;
  const sc=getSolved().filter(id=>all.some(p=>p.id===id)).length;
  const cs=document.getElementById('csolv');
  if(sc>0){cs.textContent=`✓ ${sc} solved`;cs.style.display='';}else cs.style.display='none';
  document.getElementById('progFill').style.width=(tot<=1?100:(idx/(tot-1))*100)+'%';
  const nb=document.getElementById('nextBtn');
  if(nb) nb.style.display=idx>=tot-1?'none':'';
}

/* NAVIGATE */
function tryNav(dir) {
  const ni=dir==='prev'?idx-1:idx+1;
  if(ni<0||ni>=all.length) return;
  if(!solved&&t0){
    pendDir=dir;
    document.getElementById('confirmModal').classList.add('on');
    document.getElementById('confirmYes').onclick=()=>{closeConfirm();doNav(pendDir);};
  } else doNav(dir);
}
function closeConfirm() { document.getElementById('confirmModal').classList.remove('on'); pendDir=null; }
function doNav(dir) {
  const ni=dir==='prev'?idx-1:idx+1;
  if(ni<0||ni>=all.length) return;
  const pp=document.getElementById('pp');
  const oc=dir==='next'?'sol':'sor', ic=dir==='next'?'sir':'sil';
  pp.classList.add(oc);
  setTimeout(()=>{
    pp.classList.remove(oc);
    idx=ni; puzzle=all[idx];
    reset(); rebuild(); updateNav();
    history.pushState({id:puzzle.id},'',`${location.pathname}?id=${puzzle.id}`);
    pp.classList.add(ic);
    setTimeout(()=>pp.classList.remove(ic),280);
  },240);
}
function goNext() { document.getElementById('successModal').classList.remove('on'); doNav('next'); }
function goBack() { location.href='../index.html'; }
function changeName() { location.href='../index.html'; }

window.addEventListener('popstate',e=>{
  if(e.state?.id){
    const i=all.findIndex(p=>p.id===e.state.id);
    if(i!==-1&&i!==idx){idx=i;puzzle=all[idx];reset();rebuild();updateNav();}
  }
});

/* RESET */
function reset() {
  hintsUsed=0;t0=null;solved=false;expUnlocked=false;activeHint=null;
  hUsed.def=hUsed.fodder=hUsed.indicator=false;
  stopTimer();stopExpCd();hideSlot();
  document.getElementById('successModal').classList.remove('on');
}

/* BUILD */
function build() {
  populate(); refreshGiscus();
  document.getElementById('checkBtn').onclick=checkAnswer;
  document.getElementById('navL').onclick=()=>tryNav('prev');
  document.getElementById('navR').onclick=()=>tryNav('next');
  document.getElementById('ls').style.display='none';
  document.getElementById('pg').style.display='';
  setupSwipe(); setupKeys();
}
function rebuild() {
  document.getElementById('cellsWrap').innerHTML='';
  hideSlot();
  ['defBtn','fodderBtn','indicatorBtn'].forEach(id=>document.getElementById(id).classList.remove('used','active'));
  populate(); refreshGiscus();
}
function refreshGiscus() {
  const w=document.querySelector('.g-inner');
  const old=w.querySelector('script[src="https://giscus.app/client.js"]');
  if(old){
    old.setAttribute('data-term',rawClue);
    const fr=document.createElement('script');
    Array.from(old.attributes).forEach(a=>fr.setAttribute(a.name,a.value));
    old.replaceWith(fr);
  }
}
function populate() {
  document.title=`Puzzle #${puzzle.id} — Cryptic`;
  document.getElementById('clueBox').textContent=puzzle.clue; rawClue=puzzle.clue;
  document.getElementById('diffTag').textContent=puzzle.difficulty.toUpperCase();
  document.getElementById('hintsV').textContent=0;
  document.getElementById('tval').textContent='0:00';
  document.getElementById('tval').className='tval';
  document.getElementById('tfill').style.width='0%';
  document.getElementById('tfill').className='tfill';
  const eb=document.getElementById('explainBtn');
  eb.disabled=true; eb.className='hbtn';
  document.getElementById('explainLbl').textContent='EXPLANATION 3:00';
  const name=localStorage.getItem(NK)||'Guest', dept=localStorage.getItem(DK)||'';
  document.getElementById('tbPlayer').textContent=`👤 ${name}${dept?' · '+dept:''}`;
  // Cells
  const letters=puzzle.answer.replace(/\s/g,'').length;
  document.documentElement.style.setProperty('--letters',letters);
  const cw=document.getElementById('cellsWrap'); cw.innerHTML='';
  for(let i=0;i<letters;i++){
    const inp=document.createElement('input');
    inp.className='cell'; inp.type='text'; inp.maxLength=1;
    cw.appendChild(inp);
  }
  setupCells();
}
function setupCells() {
  const cells=[...document.querySelectorAll('.cell')];
  cells.forEach((c,i)=>{
    c.addEventListener('focus',startOnce);
    c.addEventListener('input',()=>{ startOnce(); c.value=c.value.toUpperCase(); if(c.value&&i<cells.length-1) cells[i+1].focus(); else if(c.value&&i===cells.length-1){c.blur();setTimeout(checkAnswer,65);} });
    c.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!c.value&&i>0) cells[i-1].focus(); if(e.key==='Enter') checkAnswer(); if(e.key==='ArrowLeft'&&i>0){e.preventDefault();cells[i-1].focus();} if(e.key==='ArrowRight'&&i<cells.length-1){e.preventDefault();cells[i+1].focus();} });
  });
  if(cells.length) cells[0].focus();
}

/* SWIPE + KEYS */
function setupSwipe() {
  const el=document.getElementById('pp');
  el.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4) dx<0?tryNav('next'):tryNav('prev'); },{passive:true});
}
function setupKeys() {
  document.addEventListener('keydown',e=>{ if(document.activeElement?.classList.contains('cell')) return; if(e.key==='ArrowLeft') tryNav('prev'); if(e.key==='ArrowRight') tryNav('next'); });
}

/* TIMER */
function startOnce() { if(t0||solved) return; t0=Date.now(); tH=setInterval(tick,1000); startExpCd(); }
function stopTimer()  { clearInterval(tH); tH=null; }
function tick() {
  const e=getE(), m=Math.floor(e/60), s=e%60;
  const tv=document.getElementById('tval'), tf=document.getElementById('tfill');
  tv.textContent=`${m}:${s<10?'0':''}${s}`;
  tf.style.width=Math.min((e/600)*100,100)+'%';
  tv.className='tval'+(e>300?' danger':e>180?' amber':'');
  tf.className='tfill'+(e>300?' danger':e>180?' amber':'');
}
function getE() { return t0?Math.round((Date.now()-t0)/1000):0; }

/* EXPLAIN COUNTDOWN */
function startExpCd() {
  if(expUnlocked) return; stopExpCd();
  const s=Date.now();
  eH=setInterval(()=>{
    const rem=EXPLAIN_DELAY-Math.round((Date.now()-s)/1000);
    if(rem<=0){unlockExp();return;}
    const lbl=document.getElementById('explainLbl');
    if(lbl) lbl.textContent=`EXPLANATION ${Math.floor(rem/60)}:${(rem%60)<10?'0':''}${rem%60}`;
  },1000);
}
function stopExpCd() { clearInterval(eH); eH=null; }
function unlockExp() {
  stopExpCd(); expUnlocked=true;
  const eb=document.getElementById('explainBtn');
  eb.disabled=false; eb.classList.add('unlocked');
  document.getElementById('explainLbl').textContent='EXPLANATION';
  showToast('Explanation unlocked!','',2400);
}

/* HINT SLOT */
function showSlot(label,text) { document.getElementById('hsLabel').textContent=label; document.getElementById('hsText').textContent=text; document.getElementById('hsInner').classList.add('vis'); }
function hideSlot() { document.getElementById('hsInner').classList.remove('vis'); document.getElementById('hsLabel').textContent=''; document.getElementById('hsText').textContent=''; }

/* HINTS */
function showHint(type) {
  startOnce();
  const MAP={
    def:      {label:'Definition', text:puzzle.definition,  btn:'defBtn',       cls:'hl-def'},
    fodder:   {label:'Fodder',     text:puzzle.fodder,       btn:'fodderBtn',    cls:'hl-fodder'},
    indicator:{label:'Indicator',  text:puzzle.indicator,    btn:'indicatorBtn', cls:'hl-indicator'},
  };
  const {label,text,btn,cls}=MAP[type];
  // Toggle off
  if(activeHint===type){ activeHint=null; hideSlot(); document.getElementById(btn).classList.remove('active'); document.getElementById('clueBox').textContent=rawClue; return; }
  // Deactivate previous
  if(activeHint){ const pb=MAP[activeHint]?.btn; if(pb) document.getElementById(pb).classList.remove('active'); }
  if(!hUsed[type]){ hUsed[type]=true; hintsUsed++; document.getElementById('hintsV').textContent=hintsUsed; document.getElementById(btn).classList.add('used'); }
  document.getElementById(btn).classList.add('active'); activeHint=type;
  showSlot(label,text); highlightClue(text,cls);
}
function highlightClue(tgt,cls) {
  const el=document.getElementById('clueBox');
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if(new RegExp(esc(tgt.trim()),'i').test(rawClue)){ el.innerHTML=rawClue.replace(new RegExp(esc(tgt.trim()),'i'),`<span class="${cls}">$&</span>`); return; }
  let h=rawClue;
  tgt.trim().split(/\s+/).filter(w=>w.replace(/\W/g,'').length>1).forEach(w=>{ h=h.replace(new RegExp(`\\b${esc(w)}\\b`,'gi'),`<span class="${cls}">$&</span>`); });
  el.innerHTML=h;
}

/* EXPLANATION */
function showExplanation() {
  if(!expUnlocked) return;
  showSlot('How this clue works', puzzle.explanation||'No explanation available.');
  const eb=document.getElementById('explainBtn');
  eb.classList.remove('unlocked'); eb.classList.add('used'); eb.disabled=true;
  document.getElementById('explainLbl').textContent='EXPLANATION';
}

/* CHECK */
function checkAnswer() {
  if(solved) return;
  const cells=[...document.querySelectorAll('.cell')];
  const guess=cells.map(c=>c.value).join('');
  const tgt=puzzle.answer.replace(/\s/g,'');
  if(guess.length<tgt.length){ showToast('Fill in all letters first!','warn'); return; }
  if(guess===tgt){
    solved=true; stopTimer(); stopExpCd(); markSolved(puzzle.id); updateNav();
    cells.forEach(c=>c.classList.add('correct'));
    showSlot('How this clue works', puzzle.explanation||'No explanation available.');
    const eb=document.getElementById('explainBtn'); eb.disabled=true; eb.classList.remove('unlocked');
    setTimeout(showSuccess,520);
  } else {
    cells.forEach(c=>{c.classList.remove('wrong');void c.offsetWidth;c.classList.add('wrong');});
    showToast('Not quite — try again!','error');
    setTimeout(()=>{ cells.forEach(c=>{c.classList.remove('wrong');c.value='';}); cells[0].focus(); },460);
  }
}

/* SUCCESS */
function showSuccess() {
  const e=getE(), m=Math.floor(e/60), s=e%60;
  const name=localStorage.getItem(NK)||'Guest';
  document.getElementById('sPlayer').textContent=`Well done, ${name}!`;
  document.getElementById('sAnswer').textContent=puzzle.answer;
  document.getElementById('sMeta').textContent=`⏱ ${m}:${s<10?'0':''}${s}  ·  💡 ${hintsUsed} hint${hintsUsed!==1?'s':''} used`;
  const exp=puzzle.explanation||'';
  document.getElementById('sExpT').textContent=exp;
  document.getElementById('sExp').style.display=exp?'block':'none';
  updateNav();
  fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:name,quest_id:`Cryptic ${puzzle.id}`,correct:20,wrong:hintsUsed,time_spent:e,department:localStorage.getItem(DK)||'Unknown',answer:`${puzzle.answer} (Puzzle #${puzzle.id})`})})
    .then(()=>{ const r=document.getElementById('sRec'); r.style.display='block'; r.textContent=`✓ Score recorded for ${name}`; }).catch(()=>{});
  document.getElementById('successModal').classList.add('on');
}
</script>
</body>
</html>
